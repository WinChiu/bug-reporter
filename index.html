<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitlab Bug Issue Reporter (SPM)</</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #login-form {
        max-width: 500px;
      }
      .container {
        max-width: 800px;
      }
      h6 {
        color: #707070;
      }
      .hide {
        display: none;
      }
    </style>
  </head>
  <body>
    <form class="container mt-5" id="login-form">
      <h1 class="mb-2 text-center">🐞蟲蟲危機🐞</h1>
      <h6 class="mb-4 text-center">For Wellell SPM｜v 2.0</h6>
      <div class="mb-4">
        <label for="gitlab_url" class="form-label" required>Gitlab 網址</label>
        <input type="text" class="form-control" id="gitlab_url" required />
      </div>
      <div class="mb-4">
        <label for="personal_token" class="form-label" required>Token</label>
        <input type="text" class="form-control" id="personal_token" required />
      </div>
      <div class="mb-4">
        <label for="project_id" class="form-label" required>專案 ID</label>
        <input type="text" class="form-control" id="project_id" required />
      </div>
      <div class="d-flex justify-content-center mb-3">
        <button type="submit" class="btn btn-primary me-2" id="add-token">
          新增 Token
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          id="create-issue"
          onclick="window.location.href='/old-bug-reporter.html'"
        >
          使用舊版 Bug Reporter
        </button>
      </div>
      <p class="text-center" id="add-token-response"></p>
    </form>
    <form class="container mt-5 hide" id="my-form">
      <h1 class="mb-2 text-center">🐞蟲蟲危機🐞</h1>
      <h6 class="mb-4 text-center">For Wellell SPM｜v 2.0</h6>

      <h4 class="mb-4">
        測試結果
        <hr />
      </h4>
      <div class="mb-4">
        <label for="issue_title" class="form-label">議題標題</label>
        <input type="text" class="form-control" id="issue_title" required />
      </div>
      <div class="mb-4">
        <label for="classification" class="form-label">議題分類</label>
        <select id="classification" class="form-select" required>
          <option value="UI">UI</option>
          <option value="ENV">ENV</option>
          <option value="SPEC">SPEC</option>
          <option value="Content">Content</option>
          <option value="Performance">Performance</option>
          <option value="Functionality">Functionality</option>
          <option value="MultiLanguage">MultiLanguage</option>
        </select>
      </div>
      <div class="mb-4">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="regression_issue"
          />
          <label class="form-check-label" for="regression_issue">
            回歸問題
          </label>
        </div>
      </div>
      <div class="mb-5">
        <label for="prediction_result" class="form-label">期待結果:</label>
        <textarea
          class="form-control"
          id="prediction_result"
          rows="4"
          required
        ></textarea>
      </div>
      <h4 class="mb-4">
        環境資訊
        <hr />
      </h4>
      <div class="mb-4">
        <div
          class="btn-group"
          role="group"
          aria-label="Basic radio toggle button group"
        >
          <input
            type="radio"
            class="btn-check"
            name="btnradio"
            id="environment_SIT"
            autocomplete="off"
            checked
          />
          <label class="btn btn-outline-primary" for="environment_SIT"
            >SIT</label
          >
          <input
            type="radio"
            class="btn-check"
            name="btnradio"
            id="environment_UAT"
            autocomplete="off"
          />
          <label class="btn btn-outline-primary" for="environment_UAT"
            >UAT</label
          >
          <input
            type="radio"
            class="btn-check"
            name="btnradio"
            id="environment_PRO"
            autocomplete="off"
          />
          <label class="btn btn-outline-primary" for="environment_PRO"
            >PRO</label
          >
        </div>
      </div>
      <div class="mb-4">
        <label for="environment_url" class="form-label">環境網址</label>
        <input type="text" class="form-control" id="environment_url" required />
      </div>
      <div class="mb-4">
        <label for="chrome_version" class="form-label">Chrome 版本</label>
        <input type="text" class="form-control" id="chrome_version" required />
      </div>
      <div class="mb-4">
        <label for="operating_system" class="form-label">作業系統</label>
        <input
          type="text"
          class="form-control"
          id="operating_system"
          required
        />
      </div>
      <div class="mb-4">
        <label for="serial_number" class="form-label"
          >序號(SN) (optional)</label
        >
        <input type="text" class="form-control" id="serial_number" />
      </div>

      <div class="mb-4">
        <label for="build_version" class="form-label">Build Version</label>
        <input type="text" class="form-control" id="build_version" required />
      </div>

      <div class="mb-5">
        <label for="prerequisites" class="form-label"
          >前置條件 (optional)</label
        >
        <textarea class="form-control" id="prerequisites" rows="4"></textarea>
      </div>
      <h4 class="mb-4">
        操作資訊
        <hr />
      </h4>
      <div class="mb-4">
        <label for="reproduction_steps" class="form-label"
          >重現步驟 (optional)</label
        >
        <textarea
          class="form-control"
          id="reproduction_steps"
          rows="4"
        ></textarea>
      </div>
      <div class="mb-4">
        <label for="recovery_method" class="form-label"
          >復原方法 (optional)</label
        >
        <textarea class="form-control" id="recovery_method" rows="4"></textarea>
      </div>
      <div class="mb-4">
        <label for="additional_info" class="form-label"
          >附加資訊 (optional)</label
        >
        <textarea class="form-control" id="additional_info" rows="2"></textarea>
      </div>
      <div class="mb-5">
        <label for="test_case" class="form-label">測試案例 (optional)</label>
        <textarea class="form-control" id="test_case" rows="2"></textarea>
      </div>
      <h4 class="mb-4">
        參考資訊
        <hr />
      </h4>
      <div id="specifications">
        <div class="mb-4 specification-entry"></div>
      </div>
      <div class="mb-4">
        <button
          type="button"
          class="btn btn-secondary"
          onclick="addSpecification()"
        >
          新增規格
        </button>
      </div>

      <div class="mb-5">
        <label for="log_info" class="form-label">日誌 (optional)</label>
        <textarea class="form-control" id="log_info" rows="4"></textarea>
      </div>
      <h4 class="mb-4">
        標籤
        <hr />
      </h4>
      <div class="mb-4">
        <label for="assign_PIC" class="form-label">Assign</label>
        <select id="assign_PIC" class="form-select"></select>
      </div>
      <div class="row align-items-center mb-4">
        <div class="col-6">
          <label for="source_type" class="form-label">Source</label>
          <select id="source_type" class="form-select"></select>
        </div>
        <div class="col-6">
          <label for="purpose_type" class="form-label">Purpose</label>
          <select id="purpose_type" class="form-select"></select>
        </div>
      </div>
      <div class="row align-items-center mb-4">
        <div class="col-6">
          <label for="type_type" class="form-label">Type</label>
          <select id="type_type" class="form-select"></select>
        </div>
        <div class="col-6">
          <label for="priority_type" class="form-label">Priority</label>
          <select id="priority_type" class="form-select"></select>
        </div>
      </div>

      <div class="mb-3">
        <button type="submit" class="btn btn-primary mb-3" id="create-issue">
          建立 Issue
        </button>
        <p class="" id="create-response"></p>
      </div>
    </form>
    <script>
      // Get project assigner and labels
      let apiUrl = null;
      let membersApiUrl = null;
      let labelsApiUrl = null;
      let token = null;
      let gitlabUrl = null;
      let projectId = null;
      const tokenAddResponse = document.getElementById('add-token-response');
      document
        .getElementById('login-form')
        .addEventListener('submit', async (event) => {
          event.preventDefault(); // 阻止表單提交
          tokenAddResponse.classList.remove('text-danger');
          tokenAddResponse.textContent = '認證中';
          document.getElementById('add-token').disabled = true;

          if (!event.target.checkValidity()) {
            event.stopPropagation();
          } else {
            event.preventDefault();
            const personalTokenInput =
              document.getElementById('personal_token');
            gitlabUrl = document.getElementById('gitlab_url').value;
            projectId = document.getElementById('project_id').value;
            const validateToken = async () => {
              token = personalTokenInput.value;
              try {
                const response = await fetch(`${gitlabUrl}/api/v4/projects`, {
                  method: 'GET',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                });
                if (response.ok) return token;
                throw new Error('無效 Token');
              } catch (error) {
                tokenAddResponse.classList.add('text-danger');
                tokenAddResponse.textContent = error.message;
                document.getElementById('add-token').disabled = false;
                return false;
              }
            };
            const validateProject = async () => {
              try {
                const response = await fetch(
                  `${gitlabUrl}/api/v4/projects/${projectId}`,
                  {
                    method: 'GET',
                    headers: {
                      Authorization: `Bearer ${token}`,
                      'Content-Type': 'application/json',
                    },
                  }
                );
                if (response.ok) return projectId;
                throw new Error('無效專案 ID');
              } catch (error) {
                tokenAddResponse.classList.add('text-danger');
                tokenAddResponse.textContent = error.message;
                document.getElementById('add-token').disabled = false;
                return false;
              }
            };
            const fetchProjectDetails = async () => {
              try {
                // 取得 Assignable 使用者
                const membersResponse = await fetch(membersApiUrl, {
                  method: 'GET',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                });
                if (!membersResponse.ok)
                  throw new Error('Failed to fetch members');
                const members = await membersResponse.json();

                const assignSelect = document.getElementById('assign_PIC');
                members.forEach((member) => {
                  const option = document.createElement('option');
                  option.value = member.id;
                  option.textContent = member.name;
                  assignSelect.appendChild(option);
                });

                // 取得所有標籤
                const labelsResponse = await fetch(labelsApiUrl, {
                  method: 'GET',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                });
                if (!labelsResponse.ok)
                  throw new Error('Failed to fetch labels');
                const labels = await labelsResponse.json();
                const sourceLabels = [];
                const purposeLabels = [];
                const priorityLabels = [];
                const typeLabels = [];

                labels.forEach((label) => {
                  const labelNameParts = label.name.split('::');
                  switch (labelNameParts[0]) {
                    case 'Source':
                      sourceLabels.push(label);
                      break;
                    case 'purpose':
                      purposeLabels.push(label);
                      break;
                    case 'priority':
                      priorityLabels.push(label);
                      break;
                    case 'type':
                      typeLabels.push(label);
                      break;
                    default:
                      break;
                  }
                });

                // Add new options from purposeLabels
                const addOptions = (selectId, labels) =>
                  labels.forEach((label) =>
                    document.getElementById(selectId).appendChild(
                      Object.assign(document.createElement('option'), {
                        value: label.name,
                        textContent: label.name.split('::')[1],
                      })
                    )
                  );
                addOptions('purpose_type', purposeLabels);
                addOptions('source_type', sourceLabels);
                addOptions('type_type', typeLabels);
                addOptions('priority_type', priorityLabels);
              } catch (error) {
                console.error('Error:', error);
              }
            };

            if (await validateToken()) {
              if (await validateProject()) {
                apiUrl = `${gitlabUrl}/api/v4/projects/${projectId}/issues`;
                membersApiUrl = `${gitlabUrl}/api/v4/projects/${projectId}/members/all`;
                labelsApiUrl = `${gitlabUrl}/api/v4/projects/${projectId}/labels?per_page=100`;
                await fetchProjectDetails();
                document.getElementById('login-form').classList.add('hide');
                document.getElementById('my-form').classList.remove('hide');
              }
            }
          }
        });

      // Get all the rows
      const rows = document.querySelectorAll(
        '.row.align-items-center.spec-row'
      );
      // Function to toggle the delete button
      function toggleDeleteButton() {
        rows.forEach((row) => {
          const deleteButton = row.querySelector('.btn.btn-primary.btn-sm');
          if (rows.length === 1) {
            deleteButton.disabled = true;
          } else {
            deleteButton.disabled = false;
          }
        });
      }

      // Function to delete a row
      function deleteRow(event) {
        const row = event.target.closest('.row.align-items-center');
        row.remove();
        toggleDeleteButton();
      }

      // Function to add a new row
      function addSpecification() {
        const newRow = document.createElement('div');
        newRow.classList.add('row', 'align-items-center', '.spec-row');
        newRow.innerHTML = `
                                  <div class="col-3">
                                    <label class="form-label">規格名稱</label>
                                    <input type="text" class="form-control spec_name" required/>
                                  </div>
                                  <div class="col-8">
                                    <label class="form-label">規格連結</label>
                                    <input type="text" class="form-control source_url" required/>
                                  </div>
                                  <div class="col-1 mt-4">
                                    <button type="button" class="btn btn-primary btn-sm" onclick="deleteRow(event)">
                                      <i class="bi bi-trash"></i>
                                    </button>
                                  </div>
                                `;
        document.getElementById('specifications').appendChild(newRow);
        toggleDeleteButton();
      }
      // Initialize the delete buttons
      toggleDeleteButton();
      // Add event listeners to the delete buttons
      rows.forEach((row) => {
        const deleteButton = row.querySelector('.btn.btn-primary.btn-sm');
        deleteButton.addEventListener('click', deleteRow);
      });

      function generateDescription() {
        const [
          issueTitle,
          classification,
          regressionIssue,
          predictionResult,
          environmentUrl,
          chromeVersion,
          operatingSystem,
          serialNumber,
          buildVersion,
          prerequisites,
          reproductionSteps,
          recoveryMethod,
          additionalInfo,
          testCase,
          logInfo,
          assignPIC,
          sourceType,
          purposeType,
          typeType,
          priorityType,
        ] = [
          'issue_title',
          'classification',
          'regression_issue',
          'prediction_result',
          'environment_url',
          'chrome_version',
          'operating_system',
          'serial_number',
          'build_version',
          'prerequisites',
          'reproduction_steps',
          'recovery_method',
          'additional_info',
          'test_case',
          'log_info',
          'assign_PIC',
          'source_type',
          'purpose_type',
          'type_type',
          'priority_type',
        ].map((id) => {
          return document.getElementById(id).value || 'N/A';
        });

        // get environmentType
        const environmentType = document.querySelector(
          'input[name="btnradio"]:checked'
        ).nextElementSibling.textContent;

        const specNames = document.querySelectorAll('.spec_name');
        const sourceUrls = document.querySelectorAll('.source_url');
        const specEntries = Array.from(specNames).map((specName, index) => [
          specName.value,
          sourceUrls[index].value,
        ]);

        // 生成 specEntries，去除多餘的換行符
        let specEntriesMarkdown = '';
        specEntries.forEach((entry, index) => {
          specEntriesMarkdown += `${index + 1}. [${entry[index][0]}](${
            entry[index][1]
          })\n`;
        });
        specEntriesMarkdown = specEntriesMarkdown.trim(); // 去除多餘的換行符

        const descriptionMarkdown = `
      ## 問題分類 （Description）
      - 初步分類 (Classification)：${classification}
      - 回歸問題 (Regression issue)：${regressionIssue}
      ## 期待結果（Prediction of result）：
      \`\`\`
      ${predictionResult}
      \`\`\`
      ## 測試環境（Test Environment）：
      - 環境類型：${environmentType} (${environmentUrl})
      - 瀏覽器版本：Google Chrome：${chromeVersion}
      - 作業系統：${operatingSystem}
      - 序號(SN)：${serialNumber}
      - Build Version：${buildVersion}
      - 前置條件：${prerequisites === 'N/A' ? 'N/A' : `\n${prerequisites}`}
      ## 重現步驟（Step to reproduce）：${
        reproductionSteps === 'N/A' ? 'N/A' : `\n${reproductionSteps}`
      }
      ## 記錄資訊（Log info）：
      - 復原方法 (Recovery Method)：${
        recoveryMethod === 'N/A' ? 'N/A' : `\n${recoveryMethod}`
      }
      - 附加資訊 (Additional info)：${
        additionalInfo === 'N/A' ? 'N/A' : `\n${additionalInfo}`
      }
      - 測試案例 (Test Case)：${testCase === 'N/A' ? 'N/A' : `\n${testCase}`}
      - 參考規格 (Source URL)：${
        specEntriesMarkdown ? `\n${specEntriesMarkdown}` : 'N/A'
      }
      - 日誌 (Log)：${logInfo === 'N/A' ? 'N/A' : `\n${logInfo}`}
                                    `;
        return [
          issueTitle,
          descriptionMarkdown,
          assignPIC,
          sourceType,
          purposeType,
          typeType,
          priorityType,
        ];
      }

      const createGitLabIssue = async () => {
        const issueCreatedResponse = document.getElementById('create-response');
        issueCreatedResponse.classList.remove('text-success', 'text-danger');
        issueCreatedResponse.textContent = '建立中';
        document.getElementById('create-issue').disabled = true;

        const [
          issueTitle,
          descriptionMarkdown,
          assignPIC,
          sourceType,
          purposeType,
          typeType,
          priorityType,
        ] = generateDescription();
        const issueData = {
          title: issueTitle, // Issue 標題
          description: descriptionMarkdown, // Issue 描述
          labels: `${sourceType},${purposeType},${typeType},${priorityType}`, // 標籤
          assignee_ids: [assignPIC], // 指派人 ID
        };
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(issueData),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.json();
          document.getElementById('create-issue').disabled = false;
          issueCreatedResponse.classList.add('text-success');
          issueCreatedResponse.textContent = `議題建立成功: #${result.iid}`;
          setTimeout(() => {
            issueCreatedResponse.textContent = '';
          }, 500);
        } catch (error) {
          document.getElementById('create-issue').disabled = false;
          issueCreatedResponse.classList.add('text-danger');
          issueCreatedResponse.textContent = `議題建立失敗: ${error.message}`;
          setTimeout(() => {
            issueCreatedResponse.textContent = '';
          }, 500);
        }
      };

      document
        .getElementById('my-form')
        .addEventListener('submit', function (event) {
          if (!event.target.checkValidity()) {
            event.preventDefault(); // 阻止表單提交
            event.stopPropagation();
          } else {
            event.preventDefault(); // 可選，視需求而定
            createGitLabIssue(); // 執行你的邏輯
            event.target.reset();
          }
        });
      // 呼叫函數以建立 Issue
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
